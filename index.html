<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">AFK TIMER</p>
        <h1>Focus Timer</h1>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">☀</button>
    </header>

    <section class="timer-card" aria-live="polite">
      <p id="phase-label" class="phase-label">Ready to focus</p>
      <p id="timer" class="timer" role="timer" aria-label="60 minutes remaining">60:00</p>
      <div class="progress-track" aria-hidden="true">
        <div id="progress" class="progress"></div>
      </div>
      <p id="status" class="status">60 min focus <span aria-hidden="true">·</span> 10 min break</p>
    </section>

    <p id="message" class="message" role="status">Make space for focused work.</p>

    <div class="controls">
      <button id="primary-control" class="primary-control" type="button">Start focus</button>
      <button id="skip-control" class="skip-control" type="button" disabled>Skip phase <span aria-hidden="true">→</span></button>
    </div>
    <p id="error-message" class="error-message" role="alert" hidden></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
